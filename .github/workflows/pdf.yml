# Build the spec PDF from spec/*.md.
#   Pull requests: build, and attach the PDF as a workflow artifact to review.
#   Tag v*:        build, and publish a GitHub Release with the PDF attached.
name: PDF

on:
  pull_request:
    paths: ["spec/**", "scripts/**", ".github/workflows/pdf.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create, on tags only
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v6

      - name: Build PDF
        id: build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          pdf="$(scripts/build-pdf.sh "$version" | tail -n 1)"
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: spec-pdf
          path: ${{ steps.build.outputs.pdf }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.pdf }}" \
            --title "Specification $GITHUB_REF_NAME" \
            --notes "See the Changelog in spec/01-versioning.md for what changed."
